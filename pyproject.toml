[project]
name = "pfetl-analytics-studio"
version = "0.1.0"
description = "Local-first, read-only analytical companion to Personal Finance ETL for visual exploration, reporting, and intelligence."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Shan", email = "tksudharshan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5,<2.0.0",
    "kaleido>=1.5.0,<2.0.0",
    "nicegui>=4.0.0,<5.0.0",
    "platformdirs>=4.0.0",
    "plotly>=7.1.0,<8.0.0",
    "polars>=2.1.0,<3.0.0",
    "pydantic>=2.14.0,<3.0.0",
    "reportlab>=5.1.0,<6.0.0",
    "xlsxwriter>=3.3.0,<4.0.0",
]

[project.scripts]
pfetl-studio = "pfetl_analytics_studio.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pforge-cli>=0.1.1",
    "poethepoet>=0.48.0",
    "pylint>=4.1.3",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
pforge-cli = { path = "d:/Python Projects/project-forge", editable = true }

[tool.project-forge]
source = ["src"]
tests = ["tests"]
changelog = "CHANGELOG.md"

[tool.project-forge.git]
development_branch = "dev"
default_branch = "master"

[tool.project-forge.quality]
fast = ["ruff-check", "ruff-format", "mypy"]
full = ["ruff-check", "ruff-format", "mypy", "pyright", "pytest"]

[tool.project-forge.bump]
tag_prefix = "v"
files = ["pyproject.toml", "package.json", "src/pfetl_analytics_studio/__init__.py"]
commit_all = true
changelog_file = "CHANGELOG.md"

[tool.project-forge.commits]
header_max_length = 72
overrides_file = ".commit_overrides.json"

[project.urls]
Homepage = "https://github.com/tks18/pfetl-analytics-studio"
Repository = "https://github.com/tks18/pfetl-analytics-studio"
Issues = "https://github.com/tks18/pfetl-analytics-studio/issues"

