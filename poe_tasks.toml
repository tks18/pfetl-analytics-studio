# Poe the Poet Task Runner Configuration
# Repository: pfetl-analytics-studio
# Standalone Task Definitions & Orchestration
# Documentation: https://poethepoet.natn.io/index.html

[tasks]

# ------------------------------------------------------------------------------
# 1. Application Execution
# ------------------------------------------------------------------------------
dev = { cmd = "python -m pfetl_analytics_studio", help = "Run analytics studio in development mode" }
start = { cmd = "pfetl-studio", help = "Launch PFETL Analytics Studio desktop web console" }

# ------------------------------------------------------------------------------
# 2. SemVer Version Bumping (Native pforge bump)
# ------------------------------------------------------------------------------
release = { cmd = "pforge bump", help = "Bump version automatically based on Conventional Commits" }
"release:patch" = { cmd = "pforge bump --patch", help = "Bump patch version (e.g. 0.1.0 -> 0.1.1)" }
"release:minor" = { cmd = "pforge bump --minor", help = "Bump minor version (e.g. 0.1.0 -> 0.2.0)" }
"release:major" = { cmd = "pforge bump --major", help = "Bump major version (e.g. 0.1.0 -> 1.0.0)" }
"release:pre" = { cmd = "pforge bump --prerelease rc", help = "Bump prerelease version" }

# ------------------------------------------------------------------------------
# 3. Post-Release Automated Pipeline & End-to-End Flows
# ------------------------------------------------------------------------------
"release:pipeline" = { cmd = "pforge release pipeline", help = "Execute full post-release pipeline: git push -> create PR -> draft release" }
"release:flow" = { sequence = ["release", "release:pipeline"], help = "Bump version automatically and execute full post-release pipeline" }
"release:flow:patch" = { sequence = ["release:patch", "release:pipeline"], help = "Bump patch version and execute full post-release pipeline" }
"release:flow:minor" = { sequence = ["release:minor", "release:pipeline"], help = "Bump minor version and execute full post-release pipeline" }
"release:flow:major" = { sequence = ["release:major", "release:pipeline"], help = "Bump major version and execute full post-release pipeline" }

# ------------------------------------------------------------------------------
# 4. GitHub Release Management
# ------------------------------------------------------------------------------
"release:preview" = { cmd = "pforge release preview", help = "Preview release notes for latest version in CHANGELOG.md" }
"release:preview:all" = { cmd = "pforge release preview --all", help = "Preview full release notes for all versions in CHANGELOG.md" }
"release:dry-run" = { cmd = "pforge release preview", help = "Display dry-run summary of matching Git tags and changelog entries" }
"release:latest" = { cmd = "pforge release publish --latest", help = "Publish the latest version from CHANGELOG.md to GitHub" }
"release:latest:draft" = { cmd = "pforge release publish --latest --draft", help = "Publish latest version as a GitHub draft release" }
"release:all" = { cmd = "pforge release publish --interactive", help = "Publish all unreleased tags interactively to GitHub" }
"release:all:draft" = { cmd = "pforge release publish --draft", help = "Publish all unreleased tags as GitHub drafts" }

# Aliases matching gh:* conventions
"gh:release:preview" = { ref = "release:preview", help = "Alias for release:preview" }
"gh:release:preview:all" = { ref = "release:preview:all", help = "Alias for release:preview:all" }
"gh:release:dry-run" = { ref = "release:dry-run", help = "Alias for release:dry-run" }
"gh:release:latest" = { ref = "release:latest", help = "Alias for release:latest" }
"gh:release:latest:draft" = { ref = "release:latest:draft", help = "Alias for release:latest:draft" }
"gh:release:all" = { ref = "release:all", help = "Alias for release:all" }
"gh:release:all:draft" = { ref = "release:all:draft", help = "Alias for release:all:draft" }

# ------------------------------------------------------------------------------
# 5. GitHub Pull Request Management
# ------------------------------------------------------------------------------
"pr:preview" = { cmd = "pforge pr preview", help = "Preview PR title, changelog, and attached Quality Gate certification table" }
"pr:create" = { cmd = "pforge pr create", help = "Create or update PR from dev into master with Quality Gate certification" }
"gh:pr:preview" = { ref = "pr:preview", help = "Alias for pr:preview" }
"gh:pr:create" = { ref = "pr:create", help = "Alias for pr:create" }

# ------------------------------------------------------------------------------
# 6. Packaging & PyPI Publishing
# ------------------------------------------------------------------------------
"pypi:publish" = { cmd = "pforge publish", help = "Build and publish package to PyPI using token from .env" }
"build:packages" = { cmd = "uv build", help = "Build wheel and sdist distribution packages using uv build" }

# ------------------------------------------------------------------------------
# 7. Quality Gate & Diagnostics Tasks
# ------------------------------------------------------------------------------
audit = { cmd = "pforge quality", help = "Run Full Quality Gate (Ruff, Mypy, Pyright, Pytest)" }
audit-fast = { cmd = "pforge quality --fast", help = "Run Fast Quality Gate (< 2s: Ruff Lint, Ruff Format, Mypy)" }
"audit-fast:fix" = { cmd = "pforge quality --fast --fix", help = "Run Fast Quality Gate with automatic Ruff lint and format fixing" }
audit-full = { cmd = "pforge quality", help = "Run Full Quality Gate (all configured engines: Ruff, Mypy, Pyright, Pytest)" }
audit-csv = { cmd = "pforge quality --export-csv", help = "Run Full Quality Gate and export structured CSV report" }
audit-json = { cmd = "pforge quality --export-json", help = "Run Full Quality Gate and export structured JSON report" }
audit-docs = { cmd = "pforge docs audit", help = "Run AST-level documentation compliance auditor" }

# Aliases for audit
check = { ref = "audit", help = "Alias for audit" }
"check:fast" = { ref = "audit-fast", help = "Alias for audit-fast" }
"check:csv" = { ref = "audit-csv", help = "Alias for audit-csv" }

# ------------------------------------------------------------------------------
# 8. Linters, Formatters & Individual Engine Tasks
# ------------------------------------------------------------------------------
lint = { cmd = "ruff check .", help = "Run Ruff linter checks" }
"lint:fix" = { cmd = "ruff check --fix .", help = "Run Ruff linter and apply automatic fixes" }
format = { cmd = "ruff format .", help = "Format codebase using Ruff formatter" }
"format:check" = { cmd = "ruff format --check .", help = "Check formatting using Ruff formatter" }
typecheck = { sequence = ["typecheck:mypy", "typecheck:pyright"], help = "Run Mypy and Pyright typecheckers" }
"typecheck:mypy" = { cmd = "mypy src tests", help = "Run Mypy typechecker" }
"typecheck:pyright" = { cmd = "pyright", help = "Run Pyright typechecker" }
test = { cmd = "pytest tests/", help = "Run pytest test suite" }
"test:v" = { cmd = "pytest tests/ -v", help = "Run pytest test suite with verbose output" }

# ------------------------------------------------------------------------------
# 9. Git Hooks Orchestration
# ------------------------------------------------------------------------------
install-hooks = { cmd = "pforge hooks install", help = "Install Git pre-commit and pre-push quality hooks" }
prepare = { ref = "install-hooks", help = "Alias for install-hooks (npm/yarn convention)" }

# ------------------------------------------------------------------------------
# 10. Automated Conventional Commits
# ------------------------------------------------------------------------------
commit = { cmd = "pforge commit", help = "Run automated Conventional Commit tool" }
"commit:auto" = { ref = "commit", help = "Alias for commit" }
"commit:preview" = { cmd = "pforge commit --preview", help = "Preview automated Conventional Commits without staging (dry-run)" }
"commit:run" = { cmd = "pforge commit --run", help = "Execute automated Conventional Commits file-by-file immediately" }
"commit:interactive" = { cmd = "pforge commit --interactive", help = "Interactive file-by-file Commitlint wizard" }
"commit:i" = { ref = "commit:interactive", help = "Alias for commit:interactive" }
"commit:overrides" = { cmd = "pforge commit --map .commit_overrides.json --run", help = "Execute automated commits using .commit_overrides.json" }
"commit:overrides:preview" = { cmd = "pforge commit --map .commit_overrides.json --preview", help = "Preview automated commits using .commit_overrides.json" }
"commit:overrides:only" = { cmd = "pforge commit --map .commit_overrides.json --only-mapped --run", help = "Execute commits ONLY for files explicitly defined in .commit_overrides.json" }

# ------------------------------------------------------------------------------
# 11. Git Convenience Shortcuts
# ------------------------------------------------------------------------------
"git:stage" = { cmd = "git add", help = "Stage changes in Git" }
"git:push" = { cmd = "git push --follow-tags origin dev", help = "Push commits and tags to origin dev" }
