# ==============================================================================
# Mypy Type Checker Configuration
# Repository: pfetl-analytics-studio
# Python: >=3.13 | Strict Mode
# ==============================================================================

[mypy]
files = src, tests
mypy_path = src
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
no_implicit_optional = True
strict_optional = True
pretty = True
strict = True

exclude = (?x)(
    ^build
    | ^dist
    | ^docs
    | ^outputs
    | ^scratch
    | ^\.venv
  )

