# ==============================================================================
# Ruff Configuration
# Repository: pfetl-analytics-studio
# Python: >=3.13 | Convention: NumPy Docstrings | Line Length: 100
# ==============================================================================

line-length = 100
target-version = "py313"
src = ["src"]

extend-exclude = [
    "tests",
    "docs",
    "scripts",
    "outputs",
    "backups",
    "scratch",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "D",   # pydocstyle
]
extend-select = [
    "D417",  # Enforce parameter documentation in docstrings
]
ignore = [
    "E501",  # Line length handled exclusively by ruff format
]

[lint.pydocstyle]
convention = "numpy"

[lint.per-file-ignores]
"tests/**" = ["D"]  # Tests are self-documenting via test function names

